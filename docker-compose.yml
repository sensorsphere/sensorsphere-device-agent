services:
  device-agent:
    image: "${DEVICE_AGENT_IMAGE:-ghcr.io/sensorsphere/sensorsphere-device-agent:latest}"
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    # Host networking is required for LAN discovery providers such as Yeelight,
    # whose UDP multicast discovery traffic does not traverse Docker bridge NAT.
    network_mode: host
    environment:
      SENSORSPHERE_URL: "${SENSORSPHERE_URL}"
      SENSORSPHERE_DEVICE_AGENT_TOKEN: "${SENSORSPHERE_DEVICE_AGENT_TOKEN}"
      SENSORSPHERE_HEARTBEAT_INTERVAL_SECONDS: "${SENSORSPHERE_HEARTBEAT_INTERVAL_SECONDS:-20}"
      SENSORSPHERE_DEVICE_AGENT_WS_URL: "${SENSORSPHERE_DEVICE_AGENT_WS_URL:-}"
      SENSORSPHERE_LOG_LEVEL: "${SENSORSPHERE_LOG_LEVEL:-info}"
      SENSORSPHERE_RECONNECT_INITIAL_MS: "${SENSORSPHERE_RECONNECT_INITIAL_MS:-1000}"
      SENSORSPHERE_RECONNECT_MAX_MS: "${SENSORSPHERE_RECONNECT_MAX_MS:-30000}"
      AGENT_NAME: "${AGENT_NAME:-}"
      AGENT_LABELS: "${AGENT_LABELS:-}"
      YEELIGHT_REQUEST_TIMEOUT_MS: "${YEELIGHT_REQUEST_TIMEOUT_MS:-5000}"
    volumes:
      - ${DATA_DIR:-./data}:/app/data